<script>
// Old anchors become routes before anything paints. data-land picks the first frame's colour in core.css.
OLD={'#hero':'#/','#walk':'#/walk','#wall':'#/wall','#hood':'#/hood','#mean':'#/average','#average':'#/average','#compare':'#/price','#price':'#/price','#splice':'#/splice','#index':'#/closet'};
if(OLD[location.hash])history.replaceState(null,'',OLD[location.hash]);
document.documentElement.dataset.land=location.hash.split('/')[1]||'';
// One dropped script or stylesheet leaves a dead, empty stage: reload once rather than show it. Cleared on load, so one bad moment never stops a later retry.
addEventListener('error',e=>{if(/^(SCRIPT|LINK)$/.test(e.target.tagName))try{if(!sessionStorage.soeRetry){sessionStorage.soeRetry=1;location.reload()}}catch{}},true);
addEventListener('load',()=>{try{delete sessionStorage.soeRetry}catch{}});
</script>
